[package]
name = "agent-bus"
version = "0.5.0"
edition = "2024"
publish = false
description = "Fast standalone CLI + MCP server for agent-bus coordination (no Python required)"
license = "MIT"
repository = "https://github.com/David-Martel/agent-hub"
keywords = ["agent", "coordination", "mcp", "redis", "bus"]
categories = ["development-tools", "command-line-utilities"]
readme = "../README.md"

[[bin]]
name = "agent-bus"
path = "src/main.rs"

[dependencies]
agent-bus-core = { path = "../agent-bus-core", features = ["cli"] }
clap = { version = "4", features = ["derive"] }
redis = { version = "1.2", features = ["streams", "r2d2"] }
r2d2 = "0.8"
postgres = { version = "0.19", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal", "net", "sync", "time", "process", "io-util"] }
rmcp = { version = "3", features = ["server", "transport-async-rw"] }
axum = { version = "0.8", features = ["macros"] }
tokio-stream = "0.1"
tower-http = { version = "0.7", features = ["cors", "trace"] }
anyhow = "1"
rand = "0.8"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mimalloc = "0.1"
lz4_flex = "0.14"
base64 = "0.23"
smallvec = { version = "1", features = ["serde"] }
rmp-serde = "1"
regex-lite = "0.1"
# "rustls" (NOT "rustls-tls" -- reqwest 0.13 renamed the feature; verified
# against the vendored crates.io Cargo.toml, `default-tls = ["rustls"]`) so
# `https://agentbus.dtmventures.com`-style cloud-hub candidates (#79) work.
# Pulls in `rustls-platform-verifier` (OS trust store on both Linux and
# Windows -- no system OpenSSL needed) rather than a hardcoded webpki root
# bundle.
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false, optional = true }

[features]
default = ["server-mode"]
server-mode = ["dep:reqwest"]

[dev-dependencies]
tempfile = "3"
# default-features = false: the test suite's mock hubs are always plain
# http://, and leaving reqwest's default TLS backend on here would silently
# unify into the workspace's feature set (Cargo resolver 2 unifies a
# package's dev-dep features into its normal dep whenever tests are built),
# masking whether the `rustls` feature above is actually doing anything.
reqwest = { version = "0.13", features = ["json", "blocking"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "bus_benchmarks"
harness = false

[[bench]]
name = "throughput"
harness = false

[lints]
workspace = true
