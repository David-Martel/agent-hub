[package]
name = "agent-bus-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
agent-bus-core = { path = "../crates/agent-bus-core" }
arbitrary = { version = "1", features = ["derive"] }
base64 = "0.23"
libfuzzer-sys = "0.4"
lz4_flex = "0.14"
redis = "1.2"
serde_json = "1"

[lib]
name = "agent_bus_fuzz"
path = "src/lib.rs"

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "stream_entry"
path = "fuzz_targets/stream_entry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "candidates"
path = "fuzz_targets/candidates.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codecs"
path = "fuzz_targets/codecs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validation"
path = "fuzz_targets/validation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tool_args"
path = "fuzz_targets/tool_args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "network_location"
path = "fuzz_targets/network_location.rs"
test = false
doc = false
bench = false
