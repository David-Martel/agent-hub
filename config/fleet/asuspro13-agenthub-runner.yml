services:
  runner-agenthub:
    image: vigil-runner:amd64
    container_name: asuspro13-agenthub-x64
    labels:
      - ci-runner-x64
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?must set RUNNER_TOKEN env var}
      REPO: David-Martel/agent-hub
      RUNNER_NAME: asuspro13-agenthub-x64
      RUNNER_LABELS: self-hosted,Linux,X64,docker
    user: "1000:1000"
    group_add:
      - "${DOCKER_SOCKET_GID:-125}"
    volumes:
      - agenthub-runner-work:/home/runner/actions-runner/_work
      - agenthub-cargo:/home/runner/.cargo
      - agenthub-rustup:/home/runner/.rustup
      - agenthub-local-bin:/home/runner/.local/bin
      - agenthub-sccache:/home/runner/.cache/sccache/agent-hub
      - agenthub-uv:/home/runner/.cache/uv
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/local/bin/docker:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -af Runner.Listener >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  agenthub-runner-work:
  agenthub-cargo:
  agenthub-rustup:
  agenthub-local-bin:
  agenthub-sccache:
  agenthub-uv:
