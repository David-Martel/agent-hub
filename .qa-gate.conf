# agent-hub / agent-bus — git-guard QA gate overlay
# See C:\codedev\git-guard\docs\QA_TOOLING.md
# Language-gated blocking on real errors; never hit live bus ports in hooks.

# Rust: keep panics advisory by default; clippy is lefthook's job (full workspace)
astgrep_panics=warn
# JSON must parse (config/examples)
# Defaults already BLOCK invalid JSON.

# Prefer repo lefthook for fmt/clippy/test isolation; do not enable cargo clippy here
# (slow + duplicates lefthook pre-commit).
rust.clippy=off
rust.fmt=warn

# Large artifacts should warn
largefile_kb=5120
