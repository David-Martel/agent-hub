name: Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: error

# SECURITY: Never execute fork code on a self-hosted runner. Same-repository
# branches are trusted push surfaces and may use dedicated fleet runners. Do
# not add pull_request_target or remove the head-repository condition.
jobs:
  linux:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Fleet Linux Validation
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib --bins -- --test-threads=4
      - run: cargo build --locked --release --workspace --bins

  windows:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Local Windows Validation
    runs-on: [self-hosted, Windows, X64, local-build]
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
      - run: cargo test --workspace --lib --bins -- --test-threads=4
      - run: cargo build --locked --release --workspace --bins
