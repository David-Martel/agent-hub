name: CI

on:
  # PRs need their own check contexts; before this trigger a PR had none, so
  # nothing could be required and a merge proved nothing. Push is narrowed to
  # main so a PR branch is not built twice (the concurrency group is keyed on
  # github.ref, which differs between the push and the PR merge ref).
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AGENT_BUS_BUILD_REVISION: ${{ github.sha }}
  CARGO_TERM_COLOR: always
  RUST_LOG: error

jobs:
  format:
    name: Format Check
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - run: cargo fmt --all --check

  lefthook-gates:
    name: Lefthook Gates Run
    runs-on: [self-hosted, Linux, X64]
    # Fails if any lefthook command is skipped on a commit/push that changed
    # files it matches -- the "no files for inspection" dead gate that kept
    # fmt/clippy/test/audit from ever running here under `root: "."`.
    env:
      LEFTHOOK_VERSION: "2.1.9"
      LEFTHOOK_SHA256: e938f34bd05bafe1155888879a045ef4ee8cf5b4a56c9e5e9b0c2649f295636e
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned lefthook
        shell: bash
        run: |
          set -euo pipefail
          archive="lefthook_${LEFTHOOK_VERSION}_Linux_x86_64.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/$archive"
          echo "$LEFTHOOK_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          gzip -dc "$RUNNER_TEMP/$archive" > "$RUNNER_TEMP/bin/lefthook"
          chmod +x "$RUNNER_TEMP/bin/lefthook"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: bash scripts/ci/check-lefthook-gates.sh

  clippy:
    name: Clippy Lint
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-unit:
    name: Unit Tests
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - run: cargo test --workspace --lib --bins -- --test-threads=4

  test-integration:
    name: Integration Tests
    runs-on: [self-hosted, Linux, X64]
    needs: [test-unit]
    timeout-minutes: 30
    # Backend tests are #[ignore]d and run only here, against disposable Redis,
    # PostgreSQL and agent-bus-http started by this job. They FAIL when a
    # backend is unreachable or its variable is unset; the old job probed
    # localhost:6380 inside the runner container, found nothing, and reported
    # 60 early-returning tests as passes. The live bus ports (6380/5300/8400)
    # are refused by tests/support/backend_env.rs even if named explicitly.
    #
    # The runner is itself a container using the host's Docker socket, so
    # `services:` would publish on the HOST's network namespace, not this
    # job's loopback. Instead the backends join the runner container's own
    # network namespace (--network container:<self>), which makes them
    # 127.0.0.1 here -- as Settings::validate requires -- and invisible to the
    # host's live bus on 6380/5300.
    env:
      AGENT_BUS_TEST_REDIS_URL: redis://127.0.0.1:16380/0
      AGENT_BUS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:15300/agent_bus_ci
      AGENT_BUS_TEST_SERVER_URL: http://127.0.0.1:18400
      # Backend tests counted in this checkout; a lower count means tests were
      # silently lost (renamed out of #[ignore], filtered, not compiled).
      MIN_BACKEND_TESTS: "73"
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - name: Start disposable Redis and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          self="$(cat /etc/hostname)"
          docker inspect --format '{{.Name}}' "$self"
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          redis_ctr="ci-redis-$suffix"
          pg_ctr="ci-pg-$suffix"
          printf 'CI_REDIS_CTR=%s\nCI_PG_CTR=%s\n' "$redis_ctr" "$pg_ctr" >> "$GITHUB_ENV"
          docker run -d --name "$redis_ctr" --network "container:$self" \
            redis:7-alpine redis-server --port 16380 --bind 127.0.0.1 --save "" --appendonly no
          docker run -d --name "$pg_ctr" --network "container:$self" \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=agent_bus_ci -e PGPORT=15300 \
            postgres:16 -c listen_addresses=127.0.0.1
          for _ in $(seq 1 60); do
            if docker exec "$redis_ctr" redis-cli -p 16380 ping 2>/dev/null | grep -qx PONG &&
               docker exec "$pg_ctr" pg_isready -h 127.0.0.1 -p 15300 -q; then
              echo "Redis :16380 and PostgreSQL :15300 ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::disposable Redis/PostgreSQL did not become ready in 60s"
          docker logs "$redis_ctr" || true
          docker logs "$pg_ctr" || true
          exit 1
      - name: Start disposable agent-bus-http
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p agent-bus-http
          # Bind an explicit IPv4 loopback: the default host "localhost"
          # resolves to ::1 first in this container, so the server bound
          # IPv6-only and never answered 127.0.0.1 (first run of this job).
          env -u AGENT_BUS_SERVER_URL -u AGENT_BUS_AUTH_TOKEN \
            AGENT_BUS_SERVER_HOST=127.0.0.1 \
            AGENT_BUS_CONFIG="$RUNNER_TEMP/agent-bus-ci-config.json" \
            AGENT_BUS_REDIS_URL="$AGENT_BUS_TEST_REDIS_URL" \
            AGENT_BUS_DATABASE_URL="$AGENT_BUS_TEST_DATABASE_URL" \
            nohup "$CARGO_TARGET_DIR/debug/agent-bus-http" --port 18400 \
            > "$RUNNER_TEMP/agent-bus-http.log" 2>&1 &
          echo "CI_HTTP_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if curl -fsS "$AGENT_BUS_TEST_SERVER_URL/health" >/dev/null 2>&1; then
              curl -fsS "$AGENT_BUS_TEST_SERVER_URL/health"
              echo
              exit 0
            fi
            sleep 1
          done
          echo "::error::agent-bus-http did not answer /health in 60s"
          cat "$RUNNER_TEMP/agent-bus-http.log"
          exit 1
      - name: Show listeners in this job's network namespace
        shell: bash
        run: |
          set -euo pipefail
          listeners="$(docker exec "$CI_REDIS_CTR" netstat -ltn)"
          printf '%s\n' "$listeners"
          if printf '%s\n' "$listeners" | grep -Eq '[:.](6380|5300|8400)[[:space:]]'; then
            echo "::error::a live-bus port is listening in the test namespace"
            exit 1
          fi
      - name: Backend tests (ignored tests only)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --tests --no-fail-fast -- --ignored --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/backend-tests.log"
          passed="$(grep -E '^test result:' "$RUNNER_TEMP/backend-tests.log" |
            awk '{s += $4} END {print s + 0}')"
          printf '### Backend tests\n- passed: %s (floor %s)\n' "$passed" "$MIN_BACKEND_TESTS" \
            >> "$GITHUB_STEP_SUMMARY"
          if (( passed < MIN_BACKEND_TESTS )); then
            echo "::error::only $passed backend tests passed; expected at least $MIN_BACKEND_TESTS"
            exit 1
          fi
      - name: Stop disposable backends
        if: always()
        shell: bash
        run: |
          if [[ -n "${CI_HTTP_PID:-}" ]]; then
            kill "$CI_HTTP_PID" 2>/dev/null || true
            tail -n 50 "$RUNNER_TEMP/agent-bus-http.log" 2>/dev/null || true
          fi
          for ctr in "${CI_REDIS_CTR:-}" "${CI_PG_CTR:-}"; do
            [[ -n "$ctr" ]] && docker rm -f "$ctr" >/dev/null 2>&1 || true
          done

  build-release:
    name: Release Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: '["self-hosted","Linux","X64"]'
          - name: linux-arm64-1
            runner: '["self-hosted","Linux","ARM64","fleet-build"]'
          - name: linux-arm64-2
            runner: '["self-hosted","Linux","ARM64","fleet-build"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    needs: [format, clippy, test-unit]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - name: Record runner and cache provenance
        shell: bash
        run: |
          mkdir -p "$CARGO_TARGET_DIR/release"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'runner=%s\n' "$RUNNER_NAME"
            printf 'os=%s\n' "$RUNNER_OS"
            printf 'arch=%s\n' "$RUNNER_ARCH"
            printf 'cargo_target_dir=%s\n' "$CARGO_TARGET_DIR"
            printf 'rustc_wrapper=%s\n' "${RUSTC_WRAPPER:-disabled}"
            cargo --version
            rustc --version
            if command -v sccache >/dev/null 2>&1; then
              command -v sccache
              sccache --version
              sccache --show-stats
            fi
          } | tee "$CARGO_TARGET_DIR/release/build-provenance.txt"
      - run: cargo build --release --workspace --bins
      - name: Hash release binaries
        shell: bash
        run: |
          cd "$CARGO_TARGET_DIR/release"
          if command -v sccache >/dev/null 2>&1; then
            {
              printf '\npost_build_cache_stats:\n'
              sccache --show-stats
            } >> build-provenance.txt
          fi
          sha256sum agent-bus agent-bus-http agent-bus-mcp | tee artifact-sha256.txt
          cat build-provenance.txt artifact-sha256.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: agent-bus-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus-http
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus-mcp
            ${{ env.CARGO_TARGET_DIR }}/release/build-provenance.txt
            ${{ env.CARGO_TARGET_DIR }}/release/artifact-sha256.txt

  smoke-functional:
    name: CLI And HTTP Smoke
    runs-on: [self-hosted, Windows, X64, local-build]
    needs: [windows]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: agent-bus-windows-x64
          path: ci-artifacts/windows-x64
      - name: Run functional smoke harness
        shell: pwsh
        run: |
          $smokeToken = [guid]::NewGuid().ToString("N")
          ./scripts/test-agent-bus-functional.ps1 `
            -CliPath "$PWD/ci-artifacts/windows-x64/agent-bus.exe" `
            -HttpBinaryPath "$PWD/ci-artifacts/windows-x64/agent-bus-http.exe" `
            -HttpPort 8412 `
            -HttpAuthToken $smokeToken `
            -SkipForcedDegraded

  audit:
    name: Security Audit
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - name: Install latest cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit

  windows:
    name: Windows Build And Unit Tests
    runs-on: [self-hosted, Windows, X64, local-build]
    # Cold test compilation consumed 26 minutes before release and fixture checks.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - shell: pwsh
        run: ./scripts/ci/setup-rust.ps1
      - run: cargo fmt --all --check
      # Same strictness as the Linux clippy job: cfg(windows) code is only
      # linted here, so a warning in it must fail this job.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib --bins -- --test-threads=4
      - run: cargo build --release --workspace --bins
      - name: History catalog migration contract
        shell: pwsh
        run: |
          $historyDb = "agent_bus_history_ci_$($env:GITHUB_RUN_ID)_$($env:GITHUB_RUN_ATTEMPT)"
          if ($historyDb -notmatch '^agent_bus_history_ci_[0-9]+_[0-9]+$') {
            throw "Refusing unsafe disposable database name: $historyDb"
          }
          $createdb = Get-Command createdb.exe -ErrorAction Stop
          $dropdb = Get-Command dropdb.exe -ErrorAction Stop
          & $dropdb.Source -h 127.0.0.1 -p 5300 -U postgres --if-exists $historyDb
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to remove stale disposable database $historyDb"
          }
          try {
            & $createdb.Source -h 127.0.0.1 -p 5300 -U postgres $historyDb
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create disposable database $historyDb"
            }
            $env:AGENT_BUS_TEST_DATABASE_URL =
              "postgresql://postgres@127.0.0.1:5300/$historyDb"
            cargo test -p agent-bus-core --test history_catalog_postgres -- --nocapture
            if ($LASTEXITCODE -ne 0) {
              throw "History catalog migration contract failed"
            }
          } finally {
            Remove-Item Env:AGENT_BUS_TEST_DATABASE_URL -ErrorAction SilentlyContinue
            & $dropdb.Source -h 127.0.0.1 -p 5300 -U postgres --if-exists $historyDb
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to remove disposable database $historyDb"
            }
          }
      - name: Validate concurrent build helper behavior
        shell: pwsh
        run: ./scripts/test-rust-build-common.ps1
      - name: Validate fleet manifest and doctor fixtures
        shell: pwsh
        run: ./scripts/test-agent-bus-fleet-fixtures.ps1
      - name: Validate Codex MCP config parsing and launch environment
        shell: pwsh
        run: ./scripts/test-agent-client-config-validator.ps1
      - name: Record and upload Windows release provenance
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:CARGO_TARGET_DIR "release"
          $binaries = @("agent-bus.exe", "agent-bus-http.exe", "agent-bus-mcp.exe")
          $provenancePath = Join-Path $releaseDir "build-provenance.txt"
          $provenance = @(
            "commit=$env:GITHUB_SHA"
            "runner=$env:RUNNER_NAME"
            "os=$env:RUNNER_OS"
            "arch=$env:RUNNER_ARCH"
            "cargo_target_dir=$env:CARGO_TARGET_DIR"
            "rustc_wrapper=$env:RUSTC_WRAPPER"
            (& cargo --version)
            (& rustc --version)
          )
          if ($env:RUSTC_WRAPPER -and
              (Test-Path -LiteralPath $env:RUSTC_WRAPPER -PathType Leaf)) {
            $provenance += $env:RUSTC_WRAPPER
            $provenance += (& $env:RUSTC_WRAPPER --version)
            $provenance += (& $env:RUSTC_WRAPPER --show-stats)
          } else {
            $provenance += "sccache=disabled"
          }
          $provenance | Set-Content -LiteralPath $provenancePath -Encoding utf8
          $hashPath = Join-Path $releaseDir "artifact-sha256.txt"
          $binaries | ForEach-Object {
            $path = Join-Path $releaseDir $_
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            "$hash  $_"
          } | Set-Content -LiteralPath $hashPath -Encoding utf8
          Get-Content -LiteralPath $provenancePath, $hashPath |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: agent-bus-windows-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus.exe
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus-http.exe
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus-mcp.exe
            ${{ env.CARGO_TARGET_DIR }}/release/build-provenance.txt
            ${{ env.CARGO_TARGET_DIR }}/release/artifact-sha256.txt

  bench:
    name: Benchmark Compile
    runs-on: [self-hosted, Linux, X64]
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - name: Compile benchmark targets
        run: cargo bench --workspace --no-run

  docker-x64:
    name: Docker Build (linux-x64)
    runs-on: [self-hosted, Linux, X64, docker]
    steps:
      - uses: actions/checkout@v7
      - name: Validate Linux build + tests via Docker
        shell: bash
        run: |
          command -v docker >/dev/null
          docker info >/dev/null
          docker build -f docker/Dockerfile.linux -t agent-bus-linux-validate .
          printf '### Docker Build\n- Native linux-x64 image build and workspace tests passed on %s\n' \
            "$RUNNER_NAME" >> "$GITHUB_STEP_SUMMARY"

  docker-arm64:
    name: Docker Build (linux-arm64)
    runs-on: [self-hosted, Linux, ARM64, fleet-build]
    steps:
      - uses: actions/checkout@v7
      - name: Validate Linux build + tests via Docker
        shell: bash
        run: |
          command -v docker >/dev/null
          docker info >/dev/null
          docker build -f docker/Dockerfile.linux -t agent-bus-linux-validate .
          printf '### Docker Build\n- Native %s image build and workspace tests passed\n' \
            "linux-arm64" >> "$GITHUB_STEP_SUMMARY"
