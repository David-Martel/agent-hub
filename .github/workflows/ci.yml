name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: error

jobs:
  format:
    name: Format Check
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - run: cargo fmt --all --check

  clippy:
    name: Clippy Lint
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-unit:
    name: Unit Tests
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - run: cargo test --workspace --lib --bins -- --test-threads=4

  test-integration:
    name: Integration Tests
    runs-on: [self-hosted, Linux, X64]
    needs: [test-unit]
    # Uses local Redis at localhost:6380 and PostgreSQL at localhost:5300
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - name: Probe Redis and PostgreSQL
        shell: bash
        run: |
          redis_available=false
          postgres_available=false
          redis-cli -u "redis://localhost:6380/0" ping >/dev/null 2>&1 && redis_available=true
          psql "postgresql://postgres@localhost:5300/redis_backend" -Atqc "SELECT 1;" >/dev/null 2>&1 && postgres_available=true
          printf '### Integration Preflight\n- Redis available: %s\n- PostgreSQL available: %s\n' \
            "$redis_available" "$postgres_available" >> "$GITHUB_STEP_SUMMARY"
      - run: cargo test -p agent-bus --test integration_test --test http_integration_test --test channel_integration_test -- --test-threads=1
        env:
          AGENT_BUS_REDIS_URL: redis://localhost:6380/0
          AGENT_BUS_DATABASE_URL: postgresql://postgres@localhost:5300/redis_backend
      - name: History catalog migration contract
        shell: bash
        run: |
          history_db="agent_bus_history_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          if [[ ! "$history_db" =~ ^agent_bus_history_ci_[0-9]+_[0-9]+$ ]]; then
            echo "Refusing unsafe disposable database name: $history_db" >&2
            exit 1
          fi
          admin_url="postgresql://postgres@localhost:5300/postgres"
          cleanup() {
            psql "$admin_url" -v ON_ERROR_STOP=1 \
              -c "drop database if exists \"$history_db\""
          }
          trap cleanup EXIT
          cleanup
          psql "$admin_url" -v ON_ERROR_STOP=1 \
            -c "create database \"$history_db\""
          AGENT_BUS_TEST_DATABASE_URL="postgresql://postgres@localhost:5300/$history_db" \
            cargo test -p agent-bus-core --test history_catalog_postgres -- --nocapture

  build-release:
    name: Release Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: '["self-hosted","Linux","X64"]'
          - name: linux-arm64
            runner: '["self-hosted","Linux","ARM64","fleet-build"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    needs: [format, clippy, test-unit]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - run: cargo build --release --workspace --bins
      - uses: actions/upload-artifact@v7
        with:
          name: agent-bus-${{ matrix.name }}
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus-http
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus-mcp

  smoke-functional:
    name: CLI And HTTP Smoke
    runs-on: [self-hosted, Windows, X64, local-build]
    needs: [windows]
    steps:
      - uses: actions/checkout@v7
      - shell: pwsh
        run: ./scripts/ci/setup-rust.ps1
      - name: Build release binaries
        run: cargo build --locked --release --workspace --bins
      - name: Run functional smoke harness
        shell: pwsh
        run: |
          $smokeToken = [guid]::NewGuid().ToString("N")
          ./scripts/test-agent-bus-functional.ps1 `
            -CliPath "$env:CARGO_TARGET_DIR/release/agent-bus.exe" `
            -HttpBinaryPath "$env:CARGO_TARGET_DIR/release/agent-bus-http.exe" `
            -HttpPort 8412 `
            -HttpAuthToken $smokeToken `
            -SkipForcedDegraded

  audit:
    name: Security Audit
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - name: Install latest cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit

  windows:
    name: Windows Build And Unit Tests
    runs-on: [self-hosted, Windows, X64, local-build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - shell: pwsh
        run: ./scripts/ci/setup-rust.ps1
      - run: cargo fmt --all --check
      - run: cargo test --workspace --lib --bins -- --test-threads=4
      - run: cargo build --release --workspace --bins
      - name: Validate concurrent build helper behavior
        shell: pwsh
        run: ./scripts/test-rust-build-common.ps1
      - name: Validate fleet manifest and doctor fixtures
        shell: pwsh
        run: ./scripts/test-agent-bus-fleet-fixtures.ps1
      - name: Validate Codex MCP config parsing and launch environment
        shell: pwsh
        run: ./scripts/test-agent-client-config-validator.ps1

  bench:
    name: Benchmark Compile
    runs-on: [self-hosted, Linux, X64]
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - name: Compile benchmark targets
        run: cargo bench --workspace --no-run

  docker-x64:
    name: Docker Build (linux-x64)
    runs-on: [self-hosted, Windows, X64, docker-x64]
    steps:
      - uses: actions/checkout@v7
      - name: Validate Linux build + tests via Docker
        shell: pwsh
        run: |
          Get-Command docker -ErrorAction Stop | Out-Null
          docker info | Out-Null
          docker build -f docker/Dockerfile.linux -t agent-bus-linux-validate .
          @(
            '### Docker Build'
            '- Native linux-x64 image build and workspace tests passed'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  docker-arm64:
    name: Docker Build (linux-arm64)
    runs-on: [self-hosted, Linux, ARM64, fleet-build]
    steps:
      - uses: actions/checkout@v7
      - name: Validate Linux build + tests via Docker
        shell: bash
        run: |
          command -v docker >/dev/null
          docker info >/dev/null
          docker build -f docker/Dockerfile.linux -t agent-bus-linux-validate .
          printf '### Docker Build\n- Native %s image build and workspace tests passed\n' \
            "linux-arm64" >> "$GITHUB_STEP_SUMMARY"
