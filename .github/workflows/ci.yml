name: CI

on:
  # PRs need their own check contexts; before this trigger a PR had none, so
  # nothing could be required and a merge proved nothing. Push is narrowed to
  # main so a PR branch is not built twice (the concurrency group is keyed on
  # github.ref, which differs between the push and the PR merge ref).
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR revisions only. A main run must finish once it
  # starts: cancelling it on every merge kept the Windows job's persistent
  # target dir cold forever (the #64 run spent 56 min in clippy compiling
  # aws-lc-sys and was cancelled by the next push). A newer main run still
  # queues behind the running one rather than piling up.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AGENT_BUS_BUILD_REVISION: ${{ github.sha }}
  CARGO_TERM_COLOR: always
  RUST_LOG: error
  # Self-hosted runners must never inherit a developer's fleet credentials,
  # routing config or live storage URLs for unit/build jobs.
  AGENT_BUS_CONFIG: .tmp/ci/${{ github.run_id }}-${{ github.run_attempt }}/agent-bus-config.json
  AGENT_BUS_REDIS_URL: redis://127.0.0.1:1/0
  AGENT_BUS_DATABASE_URL: postgresql://postgres@127.0.0.1:1/none
  AGENT_BUS_SERVER_URL: ""
  AGENT_BUS_SERVER_URLS: ""
  AGENT_BUS_AUTH_TOKEN: ""
  AGENT_BUS_TEST_REDIS_URL: ""
  AGENT_BUS_TEST_DATABASE_URL: ""
  AGENT_BUS_TEST_SERVER_URL: ""
  AGENT_BUS_STARTUP_ENABLED: "false"
  AGENT_BUS_HUB_CACHE_TTL_SECONDS: "0"

jobs:
  format:
    name: Format Check
    runs-on: [self-hosted, Linux, X64, vigil1]
    steps:
      - uses: actions/checkout@v7
      - run: python3 -B scripts/ci/toolchain_policy.py --verify-sources
      - run: bash scripts/ci/setup-rust.sh
      - run: python3 -B scripts/ci/toolchain_policy.py --installed rust sccache
      - run: cargo fmt --all --check

  cloud-agentbus:
    name: Cloud Agentbus (TypeScript)
    runs-on: [self-hosted, Linux, X64, vigil1]
    # agent-hub#82: cloud/agentbus (the agentbus.dtmventures.com Cloudflare
    # Worker) had ZERO CI coverage before this — verified by grep, the
    # checks on 3aad635 were Rust-only. No `paths:` filter exists anywhere in
    # this repo's workflows (checked before adding this job), so this job
    # runs unconditionally like every other job here rather than introducing
    # a new, unprecedented filtering pattern. `actions/setup-node` is used
    # rather than assuming Node is preinstalled in the runner image — the
    # image identity for this repo's self-hosted runners was not verified as
    # part of this change, so don't assume `vigil-runner:amd64` or any other
    # specific base.
    defaults:
      run:
        working-directory: cloud/agentbus
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
      - run: node --version
      - run: bash ../../scripts/ci/setup-npm.sh
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  lefthook-gates:
    name: Lefthook Gates Run
    runs-on: [self-hosted, Linux, X64, vigil1]
    # Fails if any lefthook command is skipped on a commit/push that changed
    # files it matches -- the "no files for inspection" dead gate that kept
    # fmt/clippy/test/audit from ever running here under `root: "."`.
    env:
      LEFTHOOK_VERSION: "2.2.2"
      LEFTHOOK_SHA256: 2b8d7fd52771f26d7a50260ef10cd6fe704d66f60102e566362b84da09884ab7
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned lefthook
        shell: bash
        run: |
          set -euo pipefail
          archive="lefthook_${LEFTHOOK_VERSION}_Linux_x86_64.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/$archive"
          echo "$LEFTHOOK_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          gzip -dc "$RUNNER_TEMP/$archive" > "$RUNNER_TEMP/bin/lefthook"
          chmod +x "$RUNNER_TEMP/bin/lefthook"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: bash scripts/ci/check-lefthook-gates.sh
      - name: Tunnel helper stops only its own ssh
        run: bash scripts/ci/check-agent-bus-tunnel.sh

  clippy:
    name: Clippy Lint
    runs-on: [self-hosted, Linux, X64, vigil1]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Minimal CLI feature configuration
        run: cargo check -p agent-bus --no-default-features

  test-unit:
    name: Unit Tests
    runs-on: [self-hosted, Linux, X64, vigil1]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      # cargo-nextest through the vendored nextest-ci action (vigil-utils C-25): each test runs in
      # its own process, a failure is retried up to twice, and a test that only passes on retry
      # stays green but is listed in the job summary and as a warning, so a race is reported, not
      # hidden. Same selection as the `cargo test --workspace --lib --bins -- --test-threads=4` it
      # replaced. `--lib --bins` never ran doctests, so none are lost. The profile is
      # .config/nextest.toml. Runs after setup-rust.sh, whose PATH and CARGO_TARGET_DIR the
      # action's `cargo metadata` and nextest need.
      - name: Unit tests (lib and bins)
        uses: ./.github/actions/nextest-ci
        with:
          args: --workspace --lib --bins --test-threads 4
          unset-env: AGENT_BUS_SERVER_CANDIDATES
      - run: python3 -B -m unittest discover -s scripts/ci -p "test_*.py"
      - name: Non-ignored integration tests (no live backend of any kind)
        # On cargo-nextest like the unit step above; `--tests` never ran doctests either.
        # `--tests` here is deliberately NOT `--workspace --tests -- --ignored`
        # (that's test-integration's job, below, against disposable backends).
        # This runs every *non*-ignored `tests/*.rs` binary -- e.g.
        # crates/agent-bus-cli/tests/hub_routing_test.rs (#78/#81), which
        # spins up its own in-process mock HTTP hub and needs no external
        # service at all. Redis/PostgreSQL are still pinned to a closed port
        # and AGENT_BUS_SERVER_URL{,S} unset as defense in depth: a test file
        # added here later that forgets to isolate itself must fail loudly
        # against a closed port, never silently reach the live bus.
        env:
          AGENT_BUS_REDIS_URL: redis://127.0.0.1:1/0
          AGENT_BUS_DATABASE_URL: postgresql://postgres@127.0.0.1:1/none
          AGENT_BUS_HUB_CACHE_TTL_SECONDS: "0"
        uses: ./.github/actions/nextest-ci
        with:
          args: --workspace --tests --test-threads 4
          unset-env: AGENT_BUS_SERVER_URL AGENT_BUS_SERVER_URLS AGENT_BUS_SERVER_CANDIDATES AGENT_BUS_AUTH_TOKEN

  test-integration:
    name: Integration Tests
    runs-on: [self-hosted, Linux, X64, docker]
    needs: [test-unit]
    timeout-minutes: 30
    env:
      # Backend tests counted in this checkout; a lower count means tests were
      # silently lost (renamed out of #[ignore], filtered, not compiled).
      MIN_BACKEND_TESTS: "85"
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - name: All workspace backend tests with owned disposable fixtures
        shell: bash
        run: |
          set -euo pipefail
          # Share the runner's loopback namespace, rather than publishing
          # on the Docker host outside a containerized runner.
          python3 -B scripts/ci/isolated-services.py integration \
            --network-container "$(cat /etc/hostname)" \
            --minimum-backend-tests "$MIN_BACKEND_TESTS"

  test-history:
    name: History Catalog Migration
    runs-on: [self-hosted, Linux, X64, docker]
    needs: [test-unit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - name: History contract in a fresh owned PostgreSQL container
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/ci/isolated-services.py history \
            --network-container "$(cat /etc/hostname)"

  build-release:
    name: Release Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: '["self-hosted","Linux","X64","vigil1"]'
          - name: linux-arm64-1
            runner: '["self-hosted","Linux","ARM64","fleet-build"]'
          - name: linux-arm64-2
            runner: '["self-hosted","Linux","ARM64","fleet-build"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    needs: [format, clippy, test-unit]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - name: Record runner and cache provenance
        shell: bash
        run: |
          mkdir -p "$CARGO_TARGET_DIR/release"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'runner=%s\n' "$RUNNER_NAME"
            printf 'os=%s\n' "$RUNNER_OS"
            printf 'arch=%s\n' "$RUNNER_ARCH"
            printf 'cargo_target_dir=%s\n' "$CARGO_TARGET_DIR"
            printf 'rustc_wrapper=%s\n' "${RUSTC_WRAPPER:-disabled}"
            cargo --version
            rustc --version
            printf '\nnative_cache_proof:\n'
            cat "$CARGO_TARGET_DIR/native-cache-proof.json"
            if command -v sccache >/dev/null 2>&1; then
              command -v sccache
              sccache --version
              sccache --show-stats
            fi
          } | tee "$CARGO_TARGET_DIR/release/build-provenance.txt"
      - run: cargo build --release --workspace --bins
      - name: Hash release binaries
        shell: bash
        run: |
          cd "$CARGO_TARGET_DIR/release"
          if command -v sccache >/dev/null 2>&1; then
            {
              printf '\npost_build_cache_stats:\n'
              sccache --show-stats
            } >> build-provenance.txt
          fi
          sha256sum agent-bus agent-bus-http agent-bus-mcp | tee artifact-sha256.txt
          cat build-provenance.txt artifact-sha256.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: agent-bus-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 2
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus-http
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus-mcp
            ${{ env.CARGO_TARGET_DIR }}/release/build-provenance.txt
            ${{ env.CARGO_TARGET_DIR }}/release/artifact-sha256.txt

  smoke-functional:
    name: CLI And HTTP Smoke
    # The strict private outbox ACL contract requires native Windows. This
    # fleet runner owns a local Linux-container Docker daemon for fixtures.
    runs-on: [self-hosted, Windows, X64, agent-hub-native-smoke]
    needs: [windows]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: agent-bus-windows-x64
          path: ci-artifacts/windows-x64
      - name: Verify downloaded native artifact hashes
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'ci-artifacts/windows-x64'
          $manifest = Get-Content (Join-Path $root 'artifact-sha256.json') -Raw | ConvertFrom-Json
          if ($manifest.revision -cne $env:GITHUB_SHA -or $manifest.target -cne 'x86_64-pc-windows-msvc') { throw 'Native artifact provenance mismatch' }
          foreach ($name in @('agent-bus.exe', 'agent-bus-http.exe', 'agent-bus-mcp.exe')) {
            $actual = (Get-FileHash (Join-Path $root $name)).Hash.ToLowerInvariant()
            if ($actual -cne $manifest.binaries.$name) { throw "Native artifact hash mismatch: $name" }
          }
      - name: Native CLI and HTTP against owned disposable fixtures
        shell: pwsh
        run: |
          python -B scripts/ci/isolated-services.py smoke `
            --cli "$PWD/ci-artifacts/windows-x64/agent-bus.exe" `
            --http "$PWD/ci-artifacts/windows-x64/agent-bus-http.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Owned native functional smoke failed' }

  audit:
    name: Security Audit
    runs-on: [self-hosted, Linux, X64, vigil1]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - name: Install latest cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit

  windows:
    name: Windows Build And Unit Tests
    # Wine 11 drops SE_DACL_PROTECTED and adds a SYSTEM ACE when reopening a
    # directory. Run the unchanged strict ACL controls on actual Windows.
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - name: Install hash-verified hosted sccache
        shell: pwsh
        run: ./scripts/ci/install-hosted-windows-sccache.ps1
      - name: Initialize MSVC compiler environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $installation) { throw 'MSVC build tools unavailable' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) { throw "MSVC environment missing: $name" }
            "$name=$value" | Add-Content $env:GITHUB_ENV -Encoding utf8
          }
      - name: Verify pinned Rust and strict native compiler cache
        shell: pwsh
        run: ./scripts/ci/setup-rust.ps1
      - name: Isolation harness regressions
        run: python -B -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Native concurrent build helper controls
        shell: pwsh
        run: ./scripts/test-rust-build-common.ps1
      - name: Native fleet manifest and doctor controls
        shell: pwsh
        run: ./scripts/test-agent-bus-fleet-fixtures.ps1
      - name: Watchdog fixtures on Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-agent-bus-watchdog-fixtures.ps1
      - name: Watchdog fixtures on PowerShell 7
        shell: pwsh
        run: ./scripts/test-agent-bus-watchdog-fixtures.ps1
      - name: Native functional isolation controls
        shell: pwsh
        run: ./scripts/test-agent-bus-functional-isolation.ps1
      - name: Native disposable Redis readiness controls
        shell: pwsh
        run: ./scripts/test-disposable-redis-ready.ps1
      - run: cargo fmt --all --check
      - name: Strict native Windows Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: All isolated native Windows tests including ACL controls
        # Unoptimized Clap generates a ~2 MiB parser frame. Match the measured
        # CargoTools test-thread capacity; keep release/runtime settings intact.
        env:
          RUST_MIN_STACK: '8388608'
        shell: bash
        run: bash scripts/test-agent-bus-isolated.sh
      - name: Release native Windows binaries
        run: cargo build --locked --release --workspace --bins
      - name: Validate configured shipping native MCP executable
        shell: pwsh
        run: |
          # CLI `serve` delegates through PATH. Bind it to this artifact pair,
          # never another installed MCP executable on the runner.
          $release = Join-Path $env:CARGO_TARGET_DIR 'release'
          $env:PATH = "$release$([IO.Path]::PathSeparator)$env:PATH"
          ./scripts/test-agent-client-config-validator.ps1 `
            -CliPath (Join-Path $env:CARGO_TARGET_DIR 'release/agent-bus.exe') `
            -McpBinaryPath (Join-Path $env:CARGO_TARGET_DIR 'release/agent-bus-mcp.exe')
      - name: Record native release identity and hashes
        shell: pwsh
        run: |
          $release = Join-Path $env:CARGO_TARGET_DIR 'release'
          $hashes = [ordered]@{}
          foreach ($name in @('agent-bus.exe', 'agent-bus-http.exe', 'agent-bus-mcp.exe')) {
            $hashes[$name] = (Get-FileHash (Join-Path $release $name)).Hash.ToLowerInvariant()
          }
          foreach ($name in @('agent-bus.exe', 'agent-bus-http.exe')) {
            $version = (& (Join-Path $release $name) --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $version -notmatch [regex]::Escape($env:GITHUB_SHA.Substring(0, 12))) { throw "Native revision mismatch: $name" }
          }
          [ordered]@{ revision = $env:GITHUB_SHA; target = 'x86_64-pc-windows-msvc'; validation = 'native-windows'; runner = $env:RUNNER_NAME; binaries = $hashes } |
            ConvertTo-Json -Depth 4 | Set-Content (Join-Path $release 'artifact-sha256.json') -Encoding utf8NoBOM
          & $env:RUSTC_WRAPPER --show-stats --stats-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Native cache counters unavailable' }
      - uses: actions/upload-artifact@v7
        with:
          name: agent-bus-windows-x64
          if-no-files-found: error
          # release.yml reuses this artifact from the main CI run of the tagged
          # commit (scripts/ci/release_windows_artifact.py refuses an expired one),
          # so it keeps the 7-day tag window; the other CI uploads keep 2 days.
          retention-days: 7
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus.exe
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus-http.exe
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus-mcp.exe
            ${{ env.CARGO_TARGET_DIR }}/release/artifact-sha256.json

  windows-native:
    name: Windows Native Validation (manual)
    # Native-only validation that Wine cannot give: the MSVC-ABI build, real Windows
    # PowerShell behaviour, and the native executables against owned fixtures. It runs only
    # on a manual dispatch and is not part of the required PR contexts.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64, local-build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - shell: pwsh
        run: ./scripts/ci/setup-rust.ps1
      - run: cargo build --release --workspace --bins
      - name: Validate Codex MCP config parsing and launch environment
        shell: pwsh
        run: ./scripts/test-agent-client-config-validator.ps1
      - name: Native CLI and HTTP smoke against owned fixtures
        shell: pwsh
        run: |
          python -B scripts/ci/isolated-services.py smoke `
            --cli "$env:CARGO_TARGET_DIR/release/agent-bus.exe" `
            --http "$env:CARGO_TARGET_DIR/release/agent-bus-http.exe"
          if ($LASTEXITCODE -ne 0) { throw "Owned disposable functional smoke failed" }

  bench:
    name: Benchmark Compile
    runs-on: [self-hosted, Linux, X64, vigil1]
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - name: Compile benchmark targets
        run: cargo bench --workspace --no-run

  docker-x64:
    name: Docker Build (linux-x64)
    runs-on: [self-hosted, Linux, X64, docker]
    steps:
      - uses: actions/checkout@v7
      - name: Validate Linux build + tests via Docker
        shell: bash
        run: |
          command -v docker >/dev/null
          docker info >/dev/null
          docker build -f docker/Dockerfile.linux -t agent-bus-linux-validate .
          printf '### Docker Build\n- Native linux-x64 image build and workspace tests passed on %s\n' \
            "$RUNNER_NAME" >> "$GITHUB_STEP_SUMMARY"

  docker-arm64:
    name: Docker Build (linux-arm64)
    runs-on: [self-hosted, Linux, ARM64, fleet-build]
    steps:
      - uses: actions/checkout@v7
      - name: Validate Linux build + tests via Docker
        shell: bash
        run: |
          command -v docker >/dev/null
          docker info >/dev/null
          docker build -f docker/Dockerfile.linux -t agent-bus-linux-validate .
          printf '### Docker Build\n- Native %s image build and workspace tests passed\n' \
            "linux-arm64" >> "$GITHUB_STEP_SUMMARY"
