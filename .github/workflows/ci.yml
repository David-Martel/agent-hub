name: CI

on:
  # PRs need their own check contexts; before this trigger a PR had none, so
  # nothing could be required and a merge proved nothing. Push is narrowed to
  # main so a PR branch is not built twice (the concurrency group is keyed on
  # github.ref, which differs between the push and the PR merge ref).
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR revisions only. A main run must finish once it
  # starts: cancelling it on every merge kept the Windows job's persistent
  # target dir cold forever (the #64 run spent 56 min in clippy compiling
  # aws-lc-sys and was cancelled by the next push). A newer main run still
  # queues behind the running one rather than piling up.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AGENT_BUS_BUILD_REVISION: ${{ github.sha }}
  CARGO_TERM_COLOR: always
  RUST_LOG: error
  # Self-hosted runners must never inherit a developer's fleet credentials,
  # routing config or live storage URLs for unit/build jobs.
  AGENT_BUS_CONFIG: .tmp/ci/${{ github.run_id }}-${{ github.run_attempt }}/agent-bus-config.json
  AGENT_BUS_REDIS_URL: redis://127.0.0.1:1/0
  AGENT_BUS_DATABASE_URL: postgresql://postgres@127.0.0.1:1/none
  AGENT_BUS_SERVER_URL: ""
  AGENT_BUS_SERVER_URLS: ""
  AGENT_BUS_AUTH_TOKEN: ""
  AGENT_BUS_TEST_REDIS_URL: ""
  AGENT_BUS_TEST_DATABASE_URL: ""
  AGENT_BUS_TEST_SERVER_URL: ""
  AGENT_BUS_STARTUP_ENABLED: "false"
  AGENT_BUS_HUB_CACHE_TTL_SECONDS: "0"

jobs:
  format:
    name: Format Check
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - run: cargo fmt --all --check

  cloud-agentbus:
    name: Cloud Agentbus (TypeScript)
    runs-on: [self-hosted, Linux, X64]
    # agent-hub#82: cloud/agentbus (the agentbus.dtmventures.com Cloudflare
    # Worker) had ZERO CI coverage before this — verified by grep, the
    # checks on 3aad635 were Rust-only. No `paths:` filter exists anywhere in
    # this repo's workflows (checked before adding this job), so this job
    # runs unconditionally like every other job here rather than introducing
    # a new, unprecedented filtering pattern. `actions/setup-node` is used
    # rather than assuming Node is preinstalled in the runner image — the
    # image identity for this repo's self-hosted runners was not verified as
    # part of this change, so don't assume `vigil-runner:amd64` or any other
    # specific base.
    defaults:
      run:
        working-directory: cloud/agentbus
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  lefthook-gates:
    name: Lefthook Gates Run
    runs-on: [self-hosted, Linux, X64]
    # Fails if any lefthook command is skipped on a commit/push that changed
    # files it matches -- the "no files for inspection" dead gate that kept
    # fmt/clippy/test/audit from ever running here under `root: "."`.
    env:
      LEFTHOOK_VERSION: "2.1.9"
      LEFTHOOK_SHA256: e938f34bd05bafe1155888879a045ef4ee8cf5b4a56c9e5e9b0c2649f295636e
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned lefthook
        shell: bash
        run: |
          set -euo pipefail
          archive="lefthook_${LEFTHOOK_VERSION}_Linux_x86_64.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/$archive"
          echo "$LEFTHOOK_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          gzip -dc "$RUNNER_TEMP/$archive" > "$RUNNER_TEMP/bin/lefthook"
          chmod +x "$RUNNER_TEMP/bin/lefthook"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: bash scripts/ci/check-lefthook-gates.sh
      - name: Tunnel helper stops only its own ssh
        run: bash scripts/ci/check-agent-bus-tunnel.sh

  clippy:
    name: Clippy Lint
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Minimal CLI feature configuration
        run: cargo check -p agent-bus --no-default-features

  test-unit:
    name: Unit Tests
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - run: env -u AGENT_BUS_SERVER_CANDIDATES cargo test --workspace --lib --bins -- --test-threads=4
      - run: python3 -B -m unittest discover -s scripts/ci -p "test_*.py"
      - name: Non-ignored integration tests (no live backend of any kind)
        shell: bash
        # `--tests` here is deliberately NOT `--workspace --tests -- --ignored`
        # (that's test-integration's job, below, against disposable backends).
        # This runs every *non*-ignored `tests/*.rs` binary -- e.g.
        # crates/agent-bus-cli/tests/hub_routing_test.rs (#78/#81), which
        # spins up its own in-process mock HTTP hub and needs no external
        # service at all. Redis/PostgreSQL are still pinned to a closed port
        # and AGENT_BUS_SERVER_URL{,S} unset as defense in depth: a test file
        # added here later that forgets to isolate itself must fail loudly
        # against a closed port, never silently reach the live bus.
        env:
          AGENT_BUS_REDIS_URL: redis://127.0.0.1:1/0
          AGENT_BUS_DATABASE_URL: postgresql://postgres@127.0.0.1:1/none
        run: |
          set -euo pipefail
          env -u AGENT_BUS_SERVER_URL -u AGENT_BUS_SERVER_URLS -u AGENT_BUS_SERVER_CANDIDATES -u AGENT_BUS_AUTH_TOKEN \
            AGENT_BUS_HUB_CACHE_TTL_SECONDS=0 \
            cargo test --workspace --tests -- --test-threads=4

  test-integration:
    name: Integration Tests
    runs-on: [self-hosted, Linux, X64, docker]
    needs: [test-unit]
    timeout-minutes: 30
    env:
      # Backend tests counted in this checkout; a lower count means tests were
      # silently lost (renamed out of #[ignore], filtered, not compiled).
      MIN_BACKEND_TESTS: "85"
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - name: All workspace backend tests with owned disposable fixtures
        shell: bash
        run: |
          set -euo pipefail
          # Share the runner's loopback namespace, rather than publishing
          # on the Docker host outside a containerized runner.
          python3 -B scripts/ci/isolated-services.py integration \
            --network-container "$(cat /etc/hostname)" \
            --minimum-backend-tests "$MIN_BACKEND_TESTS"

  test-history:
    name: History Catalog Migration
    runs-on: [self-hosted, Linux, X64, docker]
    needs: [test-unit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - name: History contract in a fresh owned PostgreSQL container
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/ci/isolated-services.py history \
            --network-container "$(cat /etc/hostname)"

  build-release:
    name: Release Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: '["self-hosted","Linux","X64"]'
          - name: linux-arm64-1
            runner: '["self-hosted","Linux","ARM64","fleet-build"]'
          - name: linux-arm64-2
            runner: '["self-hosted","Linux","ARM64","fleet-build"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    needs: [format, clippy, test-unit]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - name: Record runner and cache provenance
        shell: bash
        run: |
          mkdir -p "$CARGO_TARGET_DIR/release"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'runner=%s\n' "$RUNNER_NAME"
            printf 'os=%s\n' "$RUNNER_OS"
            printf 'arch=%s\n' "$RUNNER_ARCH"
            printf 'cargo_target_dir=%s\n' "$CARGO_TARGET_DIR"
            printf 'rustc_wrapper=%s\n' "${RUSTC_WRAPPER:-disabled}"
            cargo --version
            rustc --version
            if command -v sccache >/dev/null 2>&1; then
              command -v sccache
              sccache --version
              sccache --show-stats
            fi
          } | tee "$CARGO_TARGET_DIR/release/build-provenance.txt"
      - run: cargo build --release --workspace --bins
      - name: Hash release binaries
        shell: bash
        run: |
          cd "$CARGO_TARGET_DIR/release"
          if command -v sccache >/dev/null 2>&1; then
            {
              printf '\npost_build_cache_stats:\n'
              sccache --show-stats
            } >> build-provenance.txt
          fi
          sha256sum agent-bus agent-bus-http agent-bus-mcp | tee artifact-sha256.txt
          cat build-provenance.txt artifact-sha256.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: agent-bus-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus-http
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus-mcp
            ${{ env.CARGO_TARGET_DIR }}/release/build-provenance.txt
            ${{ env.CARGO_TARGET_DIR }}/release/artifact-sha256.txt

  smoke-functional:
    name: CLI And HTTP Smoke
    runs-on: [self-hosted, Windows, X64, local-build]
    needs: [windows]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: agent-bus-windows-x64
          path: ci-artifacts/windows-x64
      - name: Run functional smoke harness
        shell: pwsh
        run: |
          python -B scripts/ci/isolated-services.py smoke `
            --cli "$PWD/ci-artifacts/windows-x64/agent-bus.exe" `
            --http "$PWD/ci-artifacts/windows-x64/agent-bus-http.exe"
          if ($LASTEXITCODE -ne 0) { throw "Owned disposable functional smoke failed" }

  audit:
    name: Security Audit
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - name: Install latest cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit

  windows:
    name: Windows Build And Unit Tests
    runs-on: windows-2025
    # Cold test compilation consumed 26 minutes before release and fixture checks.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install verified pinned Windows sccache
        shell: pwsh
        run: ./scripts/ci/install-hosted-windows-sccache.ps1
      - shell: pwsh
        run: |
          ./scripts/ci/setup-rust.ps1
          $compilerVersion = (& rustc --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $compilerVersion.StartsWith("rustc $env:RUSTUP_TOOLCHAIN ")) {
            throw 'Resolved Rust compiler differs from the repository toolchain pin'
          }
      - run: cargo fmt --all --check
      # Same strictness as the Linux clippy job: cfg(windows) code is only
      # linted here, so a warning in it must fail this job.
      - name: Strict Windows Clippy without shared cache
        shell: pwsh
        run: |
          . ./scripts/rust-build-common.ps1
          Disable-AgentBusSccacheForCargoSteps
          Invoke-AgentBusCargo -Label "Windows Clippy" -Command clippy -AdditionalArgs @("--workspace", "--all-targets", "--", "-D", "warnings")
      - shell: pwsh
        run: |
          Remove-Item Env:AGENT_BUS_SERVER_CANDIDATES -ErrorAction SilentlyContinue
          cargo test --workspace --lib --bins -- --test-threads=4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p agent-bus --test integration_isolation_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: cargo build --release --workspace --bins
      - run: python -B -m unittest discover -s scripts/ci -p "test_*.py"
      - name: Validate concurrent build helper behavior
        shell: pwsh
        run: ./scripts/test-rust-build-common.ps1
      - name: Validate fleet manifest and doctor fixtures
        shell: pwsh
        run: ./scripts/test-agent-bus-fleet-fixtures.ps1
      - name: Validate Codex MCP config parsing and launch environment
        shell: pwsh
        run: ./scripts/test-agent-client-config-validator.ps1
      - name: Validate functional smoke isolation and cleanup
        shell: pwsh
        run: ./scripts/test-agent-bus-functional-isolation.ps1
      - name: Validate published Redis readiness behavior
        shell: pwsh
        run: ./scripts/test-disposable-redis-ready.ps1
      - name: Record and upload Windows release provenance
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:CARGO_TARGET_DIR "release"
          $binaries = @("agent-bus.exe", "agent-bus-http.exe", "agent-bus-mcp.exe")
          $provenancePath = Join-Path $releaseDir "build-provenance.txt"
          $provenance = @(
            "commit=$env:GITHUB_SHA"
            "runner=$env:RUNNER_NAME"
            "os=$env:RUNNER_OS"
            "arch=$env:RUNNER_ARCH"
            "image_os=$env:ImageOS"
            "image_version=$env:ImageVersion"
            "sccache_archive_sha256=$env:AGENT_HUB_SCCACHE_ARCHIVE_SHA256"
            "sccache_executable_sha256=$env:AGENT_HUB_SCCACHE_EXECUTABLE_SHA256"
            "cargo_target_dir=$env:CARGO_TARGET_DIR"
            "rustc_wrapper=$env:RUSTC_WRAPPER"
            (& cargo --version)
            (& rustc --version)
          )
          if ($env:RUSTC_WRAPPER -and
              (Test-Path -LiteralPath $env:RUSTC_WRAPPER -PathType Leaf)) {
            $provenance += $env:RUSTC_WRAPPER
            $provenance += (& $env:RUSTC_WRAPPER --version)
            $provenance += (& $env:RUSTC_WRAPPER --show-stats)
          } else {
            $provenance += "sccache=disabled"
          }
          $provenance | Set-Content -LiteralPath $provenancePath -Encoding utf8
          $hashPath = Join-Path $releaseDir "artifact-sha256.txt"
          $binaries | ForEach-Object {
            $path = Join-Path $releaseDir $_
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            "$hash  $_"
          } | Set-Content -LiteralPath $hashPath -Encoding utf8
          Get-Content -LiteralPath $provenancePath, $hashPath |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: agent-bus-windows-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus.exe
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus-http.exe
            ${{ env.CARGO_TARGET_DIR }}/release/agent-bus-mcp.exe
            ${{ env.CARGO_TARGET_DIR }}/release/build-provenance.txt
            ${{ env.CARGO_TARGET_DIR }}/release/artifact-sha256.txt

  bench:
    name: Benchmark Compile
    runs-on: [self-hosted, Linux, X64]
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - name: Compile benchmark targets
        run: cargo bench --workspace --no-run

  docker-x64:
    name: Docker Build (linux-x64)
    runs-on: [self-hosted, Linux, X64, docker]
    steps:
      - uses: actions/checkout@v7
      - name: Validate Linux build + tests via Docker
        shell: bash
        run: |
          command -v docker >/dev/null
          docker info >/dev/null
          docker build -f docker/Dockerfile.linux -t agent-bus-linux-validate .
          printf '### Docker Build\n- Native linux-x64 image build and workspace tests passed on %s\n' \
            "$RUNNER_NAME" >> "$GITHUB_STEP_SUMMARY"

  docker-arm64:
    name: Docker Build (linux-arm64)
    runs-on: [self-hosted, Linux, ARM64, fleet-build]
    steps:
      - uses: actions/checkout@v7
      - name: Validate Linux build + tests via Docker
        shell: bash
        run: |
          command -v docker >/dev/null
          docker info >/dev/null
          docker build -f docker/Dockerfile.linux -t agent-bus-linux-validate .
          printf '### Docker Build\n- Native %s image build and workspace tests passed\n' \
            "linux-arm64" >> "$GITHUB_STEP_SUMMARY"
