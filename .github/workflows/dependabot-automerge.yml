# Dependabot merge intelligence (ci-accel-20260924, workstream A).
#
# Auto-merges a Dependabot PR ONLY when ALL of these hold:
#   1. It is a semver patch or minor bump (dependabot/fetch-metadata's
#      update-type), or a pinned grouped update whose group name does not
#      itself signal a major bump.
#   2. It is NOT a semver-major bump. Below 1.0 a minor bump counts as major,
#      and below 0.1 a patch bump does too (0.4 -> 0.8 broke main via #390).
#      A grouped update is checked dependency by dependency.
#   3. None of the touched dependency names match DENY_LIST_REGEX (CUDA,
#      torch, ROS, TensorRT, cuDNN/cuBLAS and similar get a label plus a
#      changelog/risk comment instead of auto-merge).
#   4. Every required check passes -- enforced by GitHub itself, not by this
#      workflow: `gh pr merge --auto` only *arms* native auto-merge, which
#      GitHub completes once required checks are green and branch protection
#      is satisfied. This workflow never polls check status itself and never
#      force-merges a red or pending PR.
#
# Runs on self-hosted runners only (the $0 posture). DRY_RUN prints the
# decision and exits without calling `gh pr merge` or `gh pr edit` -- used to
# validate the policy logic against a real, already-open Dependabot PR before
# trusting it to actually merge anything.
#
# This is deployed as an identical small per-repo workflow (not a
# cross-repo `workflow_call`) because this account's Actions "access" level
# for reusable workflows is `none` on the producer repo (vigil-utils) as of
# 2026-09-25 -- verified via `gh api repos/David-Martel/vigil-utils/actions/permissions/access`.
# Changing that is a separate, deliberate follow-up; until then a shared
# reusable workflow would silently fail to resolve for every caller. The
# canonical copy of this file lives in vigil-utils at
# docs/ci/dependabot-automerge.yml for reference; keep per-repo copies
# byte-identical except for the `runs-on` labels if a repo's runner labels
# differ.

name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to evaluate (manual test/dry-run trigger)"
        required: true
        type: number
      dry_run:
        description: "Print the decision without merging or labeling"
        required: false
        type: boolean
        default: true

permissions:
  pull-requests: write
  contents: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  decide:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64]
    env:
      # Anchors avoid over-matching unrelated crates
      # that merely contain a substring (e.g. "roslibpy" is not ROS core).
      # POSIX ERE, matched case-insensitively (grep -Ei) against one dependency name per
      # line. No PCRE "(?i)": GNU grep -E reads it as "? at start of expression", and the
      # torch/CUDA/NVIDIA alternative then never matched.
      DENY_LIST_REGEX: '(^|[-_])(torch|cuda|cudnn|cublas|tensorrt|nvidia|nvinfer)([-_]|$)|(^|[-_])ros[-_2]|(^|[-_])rclpy([-_]|$)'
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Dependabot metadata
        id: meta
        if: github.event_name != 'workflow_dispatch'
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ github.token }}

      # workflow_dispatch has no pull_request event payload for
      # fetch-metadata to read, so the manual/dry-run path derives the same
      # fields (update-type, dependency-names, dependency-group, versions) from
      # the PR's own title, which Dependabot writes in a fixed, parseable format
      # ("build(deps): bump <dep> from X.Y.Z to A.B.C" / "bump the <group> group").
      # A group title carries no per-dependency versions, so Decide policy holds it.
      - name: Derive metadata from PR title (manual dispatch only)
        id: meta_manual
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title=$(gh pr view "$PR_NUMBER" --json title --jq '.title')
          # Best-effort semver classification from "from X to Y" in the title. Dependabot
          # (and fetch-metadata's own parser) accept a "v" prefix, so "from v0.4.3 to
          # v0.5.0" must parse too; an empty pair would otherwise default to a patch.
          from_ver=$(echo "$title" | grep -oP 'from \Kv?[0-9][0-9A-Za-z.+-]*' || true)
          to_ver=$(echo "$title" | grep -oP ' to \Kv?[0-9][0-9A-Za-z.+-]*' || true)
          group=$(echo "$title" | grep -oP 'bump the \K[^ ]+(?= group)' || true)
          dep_name=$(echo "$title" | grep -oP 'bump \K[^ ]+(?= from)' || echo "$group")
          update_type="version-update:semver-patch"
          if [[ -n "$from_ver" && -n "$to_ver" ]]; then
            from_major=$(echo "${from_ver#v}" | cut -d. -f1)
            to_major=$(echo "${to_ver#v}" | cut -d. -f1)
            from_minor=$(echo "${from_ver#v}" | cut -d. -f2)
            to_minor=$(echo "${to_ver#v}" | cut -d. -f2)
            if [[ "$from_major" != "$to_major" ]]; then
              update_type="version-update:semver-major"
            elif [[ "$from_minor" != "$to_minor" ]]; then
              update_type="version-update:semver-minor"
            fi
          fi
          {
            echo "pr_title=$title"
            echo "update-type=$update_type"
            echo "dependency-names=$dep_name"
            echo "dependency-group=$group"
            echo "previous-version=$from_ver"
            echo "new-version=$to_ver"
          } >> "$GITHUB_OUTPUT"
          echo "[dry-run metadata] title='$title' update_type=$update_type dep=$dep_name"

      - name: Decide policy
        id: policy
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type || steps.meta_manual.outputs.update-type }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names || steps.meta_manual.outputs.dependency-names }}
          DEP_GROUP: ${{ steps.meta.outputs.dependency-group || steps.meta_manual.outputs.dependency-group }}
          PREV_VERSION: ${{ steps.meta.outputs.previous-version || steps.meta_manual.outputs.previous-version }}
          NEW_VERSION: ${{ steps.meta.outputs.new-version || steps.meta_manual.outputs.new-version }}
          # One entry per updated dependency. previous-version/new-version above describe
          # only the FIRST entry (fetch-metadata output.ts), while update-type is the
          # maximum over the group, so a group must be checked entry by entry.
          UPDATED_DEPS_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          echo "update_type=$UPDATE_TYPE"
          echo "dep_names=$DEP_NAMES"
          echo "dep_group=${DEP_GROUP:-}"
          is_major=false
          zero_major=false
          zero_major_detail=""
          case "$UPDATE_TYPE" in
            *semver-major*) is_major=true ;;
          esac
          # Below 1.0, semver (and Cargo) treat a minor bump as breaking, and below 0.1 a
          # patch bump too. fetch-metadata still labels 0.4 -> 0.8 "semver-minor", which is how
          # wl-nl80211 0.4 -> 0.8 (#390) auto-merged and broke main.
          breaking_zero_major() {
            local p_major p_minor p_patch n_major n_minor n_patch rest
            [[ -n "$1" && -n "$2" ]] || return 1
            IFS=. read -r p_major p_minor p_patch rest <<< "${1#v}"
            IFS=. read -r n_major n_minor n_patch rest <<< "${2#v}"
            [[ "$p_major" == 0 && "$n_major" == 0 ]] || return 1
            [[ "${p_minor:-}" != "${n_minor:-}" ]] && return 0
            [[ "${p_minor:-}" == 0 && "${p_patch:-}" != "${n_patch:-}" ]]
          }
          # One "name<TAB>prev<TAB>new" line per updated dependency. With per-dependency
          # metadata every entry is checked, so a breaking 0.x bump anywhere in a group
          # holds it regardless of ordering. Without jq that check cannot run: fail the
          # job (nothing is merged) rather than fall back to the first entry.
          pairs=""
          if [[ -n "${UPDATED_DEPS_JSON:-}" ]]; then
            if ! command -v jq >/dev/null 2>&1; then
              echo "::error::jq is required to check every entry of updated-dependencies-json; refusing to decide"
              exit 1
            fi
            pairs=$(jq -r '.[] | [.dependencyName, (.prevVersion // ""), (.newVersion // "")] | @tsv' <<< "$UPDATED_DEPS_JSON")
          elif [[ -z "${DEP_GROUP:-}" ]]; then
            pairs=$(printf '%s\t%s\t%s' "$DEP_NAMES" "$PREV_VERSION" "$NEW_VERSION")
          fi
          printf 'versions: %s\n' "${pairs:-<none>}"
          while IFS=$'\t' read -r name prev new; do
            if breaking_zero_major "$prev" "$new"; then
              is_major=true
              zero_major=true
              zero_major_detail="$name $prev -> $new"
              break
            fi
          done <<< "$pairs"
          # A group seen without per-dependency versions (the manual-dispatch title path)
          # cannot be checked for 0.x bumps, so it is held rather than assumed compatible.
          group_unverified=false
          if [[ -n "${DEP_GROUP:-}" && -z "${UPDATED_DEPS_JSON:-}" ]]; then
            group_unverified=true
          fi
          denied=false
          # fetch-metadata joins names with ", "; split so every name meets the anchors.
          if [[ -n "$DEP_NAMES" ]] && printf '%s\n' "$DEP_NAMES" | tr ',' '\n' | tr -d ' ' | grep -Eiq -- "$DENY_LIST_REGEX"; then
            denied=true
          fi
          decision=automerge
          reason=""
          if [[ "$zero_major" == true ]]; then
            decision=hold
            reason="breaking 0.x bump ($zero_major_detail)"
          elif [[ "$is_major" == true ]]; then
            decision=hold
            reason="semver-major bump ($UPDATE_TYPE)"
          elif [[ "$group_unverified" == true ]]; then
            decision=hold
            reason="grouped update ($DEP_GROUP) without per-dependency versions"
          elif [[ "$denied" == true ]]; then
            decision=hold
            reason="deny-listed dependency ($DEP_NAMES matched $DENY_LIST_REGEX)"
          fi
          {
            echo "is_major=$is_major"
            echo "denied=$denied"
            echo "decision=$decision"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "DECISION: $decision ${reason:+($reason)}"

      - name: Hold -- label and comment (real runs only)
        if: steps.policy.outputs.decision == 'hold' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --add-label "dependabot-hold" || \
            gh label create "dependabot-hold" --color "B60205" \
              --description "Held from auto-merge: major bump or deny-listed dependency" \
              --repo "${{ github.repository }}" && \
            gh pr edit "$PR_NUMBER" --add-label "dependabot-hold"
          BODY_FILE=$(mktemp)
          {
            echo "Auto-merge withheld: ${{ steps.policy.outputs.reason }}."
            echo ""
            echo "Update type: \`${{ steps.meta.outputs.update-type || steps.meta_manual.outputs.update-type }}\`"
            echo "Dependency: \`${{ steps.meta.outputs.dependency-names || steps.meta_manual.outputs.dependency-names }}\`"
            echo ""
            echo "Please review the changelog/release notes and merge manually."
          } > "$BODY_FILE"
          gh pr comment "$PR_NUMBER" --body-file "$BODY_FILE"

      - name: Automerge -- enable native GitHub auto-merge (real runs only)
        if: steps.policy.outputs.decision == 'automerge' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --auto --squash

      - name: Dry-run report (no mutation)
        if: env.DRY_RUN == 'true'
        env:
          DECISION: ${{ steps.policy.outputs.decision }}
          UPDATE_TYPE_OUT: ${{ steps.meta.outputs.update-type || steps.meta_manual.outputs.update-type }}
          DEP_NAMES_OUT: ${{ steps.meta.outputs.dependency-names || steps.meta_manual.outputs.dependency-names }}
          REASON: ${{ steps.policy.outputs.reason }}
        run: |
          set -euo pipefail
          would_run="gh pr edit + gh pr comment (hold)"
          if [[ "$DECISION" == "automerge" ]]; then
            would_run="gh pr merge $PR_NUMBER --auto --squash"
          fi
          {
            echo "### Dependabot auto-merge dry-run"
            echo "PR: #$PR_NUMBER"
            echo "update_type: $UPDATE_TYPE_OUT"
            echo "dependency_names: $DEP_NAMES_OUT"
            echo "decision: $DECISION"
            echo "reason: $REASON"
            echo "Would have run: $would_run"
          } >> "$GITHUB_STEP_SUMMARY"
