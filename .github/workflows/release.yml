name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  AGENT_BUS_BUILD_REVISION: ${{ github.sha }}
  CARGO_TERM_COLOR: always
  AGENT_BUS_CONFIG: .tmp/release/${{ github.run_id }}-${{ github.run_attempt }}/agent-bus-config.json
  AGENT_BUS_REDIS_URL: redis://127.0.0.1:1/0
  AGENT_BUS_DATABASE_URL: postgresql://postgres@127.0.0.1:1/none
  AGENT_BUS_SERVER_URL: ""
  AGENT_BUS_SERVER_URLS: ""
  AGENT_BUS_AUTH_TOKEN: ""
  AGENT_BUS_TEST_REDIS_URL: ""
  AGENT_BUS_TEST_DATABASE_URL: ""
  AGENT_BUS_TEST_SERVER_URL: ""
  AGENT_BUS_STARTUP_ENABLED: "false"
  AGENT_BUS_HUB_CACHE_TTL_SECONDS: "0"

jobs:
  windows-x64:
    name: Windows x64 release
    # Reuse the same-commit main CI MSVC artifact after all reviewed jobs passed.
    # No compilation or new fleet smoke admission occurs in the release job.
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify Cargo version matches tag
        shell: pwsh
        run: |
          $versions = @(Select-String -LiteralPath crates/agent-bus-cli/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"\s*$')
          if ($versions.Count -ne 1 -or $versions[0].Matches[0].Groups[1].Value -cne $env:GITHUB_REF_NAME.Substring(1)) { throw 'Cargo version does not match release tag' }
      - name: Reuse exact-commit accepted main CI Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP 'agent-hub-native-release-artifact'
          python -B scripts/ci/release_windows_artifact.py download `
            --repo-root "$PWD" --repository "$env:GITHUB_REPOSITORY" `
            --revision "$env:GITHUB_SHA" --artifact-dir "$release"
          if ($LASTEXITCODE -ne 0) { throw 'Exact main CI Windows artifact admission failed' }
      - name: Verify reused native revision and configured MCP before staging
        timeout-minutes: 10
        shell: pwsh
        run: |
          # CLI serve delegates through PATH: bind it to this verified artifact pair.
          $release = Join-Path $env:RUNNER_TEMP 'agent-hub-native-release-artifact'
          $env:PATH = "$release$([IO.Path]::PathSeparator)$env:PATH"
          function Read-ReusedNativeVersion([string]$Executable) {
            $process = [Diagnostics.Process]::new()
            $process.StartInfo.FileName = $Executable
            $process.StartInfo.ArgumentList.Add('--version')
            $process.StartInfo.UseShellExecute = $false
            $process.StartInfo.RedirectStandardOutput = $true
            $process.StartInfo.RedirectStandardError = $true
            $process.StartInfo.Environment.Clear()
            foreach ($key in @('SystemRoot', 'WINDIR', 'PATH', 'PATHEXT', 'TEMP', 'TMP', 'USERPROFILE', 'APPDATA', 'LOCALAPPDATA')) {
              $value = [Environment]::GetEnvironmentVariable($key)
              if ($null -ne $value) { $process.StartInfo.Environment[$key] = $value }
            }
            $process.StartInfo.Environment['AGENT_BUS_STARTUP_ENABLED'] = 'false'
            $started = $false
            $stdout = $stderr = $null
            $deadline = [Diagnostics.Stopwatch]::StartNew()
            try {
              if (-not $process.Start()) { throw 'Reused native version client did not start' }
              $started = $true
              $stdout = $process.StandardOutput.ReadToEndAsync()
              $stderr = $process.StandardError.ReadToEndAsync()
              $remaining = [int][Math]::Max(0, 10000 - $deadline.ElapsedMilliseconds)
              $finished = $process.WaitForExit($remaining) -and $deadline.ElapsedMilliseconds -lt 10000
              if (-not $finished -and -not $process.HasExited) { $process.Kill($false) }
              $settlement = [Diagnostics.Stopwatch]::StartNew()
              if (-not $process.HasExited) { [void]$process.WaitForExit(2000) }
              $remaining = [int][Math]::Max(0, 2000 - $settlement.ElapsedMilliseconds)
              [void][Threading.Tasks.Task]::WhenAll([Threading.Tasks.Task[]]@($stdout, $stderr)).Wait($remaining)
              if (-not $finished -or $deadline.ElapsedMilliseconds -ge 10000 -or -not $process.HasExited -or -not $stdout.IsCompletedSuccessfully -or -not $stderr.IsCompletedSuccessfully -or $process.ExitCode -ne 0) { throw 'Reused native version client deadline/exit/pipe proof failed' }
              return $stdout.GetAwaiter().GetResult().Trim()
            } finally {
              if (-not $started -or ($process.HasExited -and $stdout -and $stderr -and $stdout.IsCompleted -and $stderr.IsCompleted)) { $process.Dispose() }
              else { $script:UnsettledReleaseVersionClient = $process }
            }
          }
          foreach ($name in @('agent-bus.exe', 'agent-bus-http.exe')) {
            $version = Read-ReusedNativeVersion (Join-Path $release $name)
            if ($version -notmatch [regex]::Escape($env:GITHUB_SHA.Substring(0, 12))) { throw "Reused native revision mismatch: $name" }
          }
          ./scripts/test-agent-client-config-validator.ps1 `
            -CliPath (Join-Path $release 'agent-bus.exe') `
            -McpBinaryPath (Join-Path $release 'agent-bus-mcp.exe')
      - name: Refresh accepted CI metadata and stage identical artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # This authenticated step executes only the metadata/staging helper.
          $release = Join-Path $env:RUNNER_TEMP 'agent-hub-native-release-artifact'
          python -B scripts/ci/release_windows_artifact.py stage `
            --repo-root "$PWD" --repository "$env:GITHUB_REPOSITORY" `
            --revision "$env:GITHUB_SHA" --artifact-dir "$release" --dist "$PWD/dist"
          if ($LASTEXITCODE -ne 0) { throw 'Reused native artifact staging failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: agent-bus-windows-x64
          if-no-files-found: error
          path: dist/*

  linux:
    name: Linux release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: '["self-hosted","Linux","X64","vigil1"]'
          - name: linux-arm64
            runner: '["self-hosted","Linux","ARM64","fleet-build"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 -B scripts/ci/toolchain_policy.py --verify-sources
      - run: bash scripts/ci/setup-rust.sh
      - run: python3 -B scripts/ci/toolchain_policy.py --installed rust sccache

      - name: Verify Cargo version matches tag
        shell: bash
        run: |
          cargo_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' crates/agent-bus-cli/Cargo.toml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$cargo_version" = "$tag_version" || {
            echo "Cargo version $cargo_version does not match tag $tag_version" >&2
            exit 1
          }

      - run: cargo build --locked --release --workspace --bins

      - name: Verify embedded runtime revision
        shell: bash
        run: |
          expected_prefix="${AGENT_BUS_BUILD_REVISION:0:12}"
          cli_version="$("$CARGO_TARGET_DIR/release/agent-bus" --version)"
          grep -Fqi "$expected_prefix" <<<"$cli_version" || {
            echo "CLI build provenance mismatch: expected $expected_prefix, got $cli_version" >&2
            exit 1
          }
          http_version="$("$CARGO_TARGET_DIR/release/agent-bus-http" --version)"
          grep -Fqi "$expected_prefix" <<<"$http_version" || {
            echo "HTTP build provenance mismatch: expected $expected_prefix, got $http_version" >&2
            exit 1
          }

      - name: Stage artifacts and checksums
        shell: bash
        run: |
          mkdir -p dist
          for binary in agent-bus agent-bus-http agent-bus-mcp; do
            cp "$CARGO_TARGET_DIR/release/$binary" "dist/$binary-${{ matrix.name }}"
          done
          {
            printf 'commit=%s\nrunner=%s\nos=%s\narch=%s\n' \
              "$GITHUB_SHA" "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
            cargo --version
            rustc --version
            printf '\nnative_cache_proof:\n'
            cat "$CARGO_TARGET_DIR/native-cache-proof.json"
          } > "dist/BUILD-${{ matrix.name }}.txt"
          cd dist
          sha256sum ./* > "SHA256SUMS-${{ matrix.name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: agent-bus-${{ matrix.name }}
          path: dist/*

  publish:
    name: Publish GitHub release
    runs-on: [self-hosted, Linux, X64]
    needs: [windows-x64, linux]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: agent-bus-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Redis + PostgreSQL coordination bus for multi-agent AI systems.

            Artifacts are published for Windows x64, Linux x64, and Linux
            ARM64. Verify the matching `SHA256SUMS-*` file before installation.
