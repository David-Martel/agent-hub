name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  AGENT_BUS_BUILD_REVISION: ${{ github.sha }}
  CARGO_TERM_COLOR: always

jobs:
  windows-x64:
    name: Windows x64 release
    # Cross-compiled on Linux for x86_64-pc-windows-gnu (mingw-w64) on the windows-cross lane
    # and checked under Wine. Earlier releases were MSVC-ABI builds from a native Windows runner.
    runs-on: [self-hosted, Linux, X64, windows-cross]
    timeout-minutes: 60
    env:
      WINDOWS_TARGET: x86_64-pc-windows-gnu
      WINEDEBUG: "-all"
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh
      - run: rustup target add "$WINDOWS_TARGET"

      - name: Verify Cargo version matches tag
        shell: bash
        run: |
          cargo_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' crates/agent-bus-cli/Cargo.toml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$cargo_version" = "$tag_version" || {
            echo "Cargo version $cargo_version does not match tag $tag_version" >&2
            exit 1
          }

      - name: Release build
        timeout-minutes: 25
        run: cargo build --locked --release --target "$WINDOWS_TARGET" --workspace --bins

      - name: Verify embedded runtime revision under Wine
        shell: bash
        timeout-minutes: 5
        run: |
          export WINEPREFIX="$RUNNER_TEMP/wine-prefix"
          timeout 120 wineboot --init
          release="$CARGO_TARGET_DIR/$WINDOWS_TARGET/release"
          expected_prefix="${AGENT_BUS_BUILD_REVISION:0:12}"
          for binary in agent-bus agent-bus-http; do
            version="$(wine "$release/$binary.exe" --version)"
            grep -Fqi "$expected_prefix" <<<"$version" || {
              echo "$binary build provenance mismatch: expected $expected_prefix, got $version" >&2
              exit 1
            }
          done
          echo "wine_version=$(wine --version)" > "$RUNNER_TEMP/wine-version.txt"

      - name: Stage artifacts and checksums
        shell: bash
        run: |
          release="$CARGO_TARGET_DIR/$WINDOWS_TARGET/release"
          mkdir -p dist
          for binary in agent-bus agent-bus-http agent-bus-mcp; do
            cp "$release/$binary.exe" "dist/$binary-windows-x64.exe"
          done
          {
            echo "commit=$GITHUB_SHA"
            echo "target=$WINDOWS_TARGET"
            echo "abi=gnu"
            echo "validation=wine"
            echo "native_windows_validated=false"
            cat "$RUNNER_TEMP/wine-version.txt"
            rustc --version
          } > dist/BUILD-windows-x64.txt
          cd dist
          sha256sum ./*.exe > SHA256SUMS-windows-x64

      - uses: actions/upload-artifact@v7
        with:
          name: agent-bus-windows-x64
          path: dist/*

  linux:
    name: Linux release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: '["self-hosted","Linux","X64"]'
          - name: linux-arm64
            runner: '["self-hosted","Linux","ARM64","fleet-build"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh

      - name: Verify Cargo version matches tag
        shell: bash
        run: |
          cargo_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' crates/agent-bus-cli/Cargo.toml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$cargo_version" = "$tag_version" || {
            echo "Cargo version $cargo_version does not match tag $tag_version" >&2
            exit 1
          }

      - run: cargo build --locked --release --workspace --bins

      - name: Verify embedded runtime revision
        shell: bash
        run: |
          expected_prefix="${AGENT_BUS_BUILD_REVISION:0:12}"
          cli_version="$("$CARGO_TARGET_DIR/release/agent-bus" --version)"
          grep -Fqi "$expected_prefix" <<<"$cli_version" || {
            echo "CLI build provenance mismatch: expected $expected_prefix, got $cli_version" >&2
            exit 1
          }
          http_version="$("$CARGO_TARGET_DIR/release/agent-bus-http" --version)"
          grep -Fqi "$expected_prefix" <<<"$http_version" || {
            echo "HTTP build provenance mismatch: expected $expected_prefix, got $http_version" >&2
            exit 1
          }

      - name: Stage artifacts and checksums
        shell: bash
        run: |
          mkdir -p dist
          for binary in agent-bus agent-bus-http agent-bus-mcp; do
            cp "$CARGO_TARGET_DIR/release/$binary" "dist/$binary-${{ matrix.name }}"
          done
          cd dist
          sha256sum ./* > "SHA256SUMS-${{ matrix.name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: agent-bus-${{ matrix.name }}
          path: dist/*

  publish:
    name: Publish GitHub release
    runs-on: [self-hosted, Linux, X64]
    needs: [windows-x64, linux]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: agent-bus-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Redis + PostgreSQL coordination bus for multi-agent AI systems.

            Artifacts are published for Windows x64, Linux x64, and Linux
            ARM64. Verify the matching `SHA256SUMS-*` file before installation.
