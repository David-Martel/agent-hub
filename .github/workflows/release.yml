name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  AGENT_BUS_BUILD_REVISION: ${{ github.sha }}
  CARGO_TERM_COLOR: always

jobs:
  windows-x64:
    name: Windows x64 release
    runs-on: [self-hosted, Windows, X64, local-build]
    steps:
      - uses: actions/checkout@v7
      - shell: pwsh
        run: ./scripts/ci/setup-rust.ps1

      - name: Verify Cargo version matches tag
        shell: pwsh
        run: |
          $cargoVersion = (Select-String -Path crates/agent-bus-cli/Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($cargoVersion -ne $tagVersion) {
            throw "Cargo version $cargoVersion does not match tag $tagVersion"
          }

      - run: cargo build --locked --release --workspace --bins

      - name: Verify embedded runtime revision
        shell: pwsh
        run: |
          $expectedPrefix = $env:AGENT_BUS_BUILD_REVISION.Substring(0, 12)
          $cliVersion = & target/release/agent-bus.exe --version
          if (-not $cliVersion.Contains($expectedPrefix, [StringComparison]::OrdinalIgnoreCase)) {
            throw "CLI build provenance mismatch: expected $expectedPrefix, got $cliVersion"
          }

          $env:AGENT_BUS_SERVER_HOST = "localhost"
          $env:AGENT_BUS_SERVER_PORT = "8414"
          $process = Start-Process `
            -FilePath "$PWD/target/release/agent-bus-http.exe" `
            -PassThru `
            -WindowStyle Hidden
          try {
            $health = $null
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "http://localhost:8414/health" -TimeoutSec 2
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if ($null -eq $health) {
              throw "HTTP release artifact did not become healthy enough to report provenance"
            }
            if (-not ([string]$health.build_version).Contains(
                $expectedPrefix,
                [StringComparison]::OrdinalIgnoreCase
              )) {
              throw "HTTP build provenance mismatch: expected $expectedPrefix, got $($health.build_version)"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Stage artifacts and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $binaries = @('agent-bus', 'agent-bus-http', 'agent-bus-mcp')
          foreach ($binary in $binaries) {
            $name = "$binary-windows-x64.exe"
            Copy-Item "target/release/$binary.exe" "dist/$name"
            $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Add-Content -Path dist/SHA256SUMS-windows-x64 -Encoding ascii
          }

      - uses: actions/upload-artifact@v7
        with:
          name: agent-bus-windows-x64
          path: dist/*

  linux:
    name: Linux release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: '["self-hosted","Linux","X64"]'
          - name: linux-arm64
            runner: '["self-hosted","Linux","ARM64","fleet-build"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh

      - name: Verify Cargo version matches tag
        shell: bash
        run: |
          cargo_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' crates/agent-bus-cli/Cargo.toml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$cargo_version" = "$tag_version" || {
            echo "Cargo version $cargo_version does not match tag $tag_version" >&2
            exit 1
          }

      - run: cargo build --locked --release --workspace --bins

      - name: Verify embedded runtime revision
        shell: bash
        run: |
          expected_prefix="${AGENT_BUS_BUILD_REVISION:0:12}"
          cli_version="$("$CARGO_TARGET_DIR/release/agent-bus" --version)"
          grep -Fqi "$expected_prefix" <<<"$cli_version" || {
            echo "CLI build provenance mismatch: expected $expected_prefix, got $cli_version" >&2
            exit 1
          }

          export AGENT_BUS_SERVER_HOST=localhost
          export AGENT_BUS_SERVER_PORT=8414
          "$CARGO_TARGET_DIR/release/agent-bus-http" >release-http.log 2>&1 &
          http_pid=$!
          trap 'kill "$http_pid" 2>/dev/null || true' EXIT
          health=""
          for _ in $(seq 1 30); do
            health="$(curl --fail --silent http://localhost:8414/health 2>/dev/null || true)"
            test -n "$health" && break
            sleep 0.5
          done
          grep -Fqi "$expected_prefix" <<<"$health" || {
            echo "HTTP build provenance mismatch: expected $expected_prefix, got $health" >&2
            cat release-http.log >&2
            exit 1
          }

      - name: Stage artifacts and checksums
        shell: bash
        run: |
          mkdir -p dist
          for binary in agent-bus agent-bus-http agent-bus-mcp; do
            cp "$CARGO_TARGET_DIR/release/$binary" "dist/$binary-${{ matrix.name }}"
          done
          cd dist
          sha256sum ./* > "SHA256SUMS-${{ matrix.name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: agent-bus-${{ matrix.name }}
          path: dist/*

  publish:
    name: Publish GitHub release
    runs-on: [self-hosted, Linux, X64]
    needs: [windows-x64, linux]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: agent-bus-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Redis + PostgreSQL coordination bus for multi-agent AI systems.

            Artifacts are published for Windows x64, Linux x64, and Linux
            ARM64. Verify the matching `SHA256SUMS-*` file before installation.
