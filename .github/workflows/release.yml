name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  AGENT_BUS_BUILD_REVISION: ${{ github.sha }}
  CARGO_TERM_COLOR: always
  AGENT_BUS_CONFIG: .tmp/release/${{ github.run_id }}-${{ github.run_attempt }}/agent-bus-config.json
  AGENT_BUS_REDIS_URL: redis://127.0.0.1:1/0
  AGENT_BUS_DATABASE_URL: postgresql://postgres@127.0.0.1:1/none
  AGENT_BUS_SERVER_URL: ""
  AGENT_BUS_SERVER_URLS: ""
  AGENT_BUS_AUTH_TOKEN: ""
  AGENT_BUS_TEST_REDIS_URL: ""
  AGENT_BUS_TEST_DATABASE_URL: ""
  AGENT_BUS_TEST_SERVER_URL: ""
  AGENT_BUS_STARTUP_ENABLED: "false"
  AGENT_BUS_HUB_CACHE_TTL_SECONDS: "0"

jobs:
  windows-x64:
    name: Windows x64 release
    # Cross-compiled on Linux for x86_64-pc-windows-gnu (mingw-w64) on the windows-cross lane
    # and checked under Wine. Earlier releases were MSVC-ABI builds from a native Windows runner.
    runs-on: [self-hosted, Linux, X64, docker, windows-cross]
    timeout-minutes: 60
    env:
      WINDOWS_TARGET: x86_64-pc-windows-gnu
      WINEDEBUG: "-all"
    steps:
      - uses: actions/checkout@v7
      - name: Validate owned Wine job controls
        run: python3 -B -m unittest discover -s scripts/ci -p test_wine_job.py -v
      - name: Verify qualified cross runner, pinned compiler and strict cache
        shell: pwsh
        run: ./scripts/ci/setup-windows-cross.ps1

      - name: Verify Cargo version matches tag
        shell: bash
        run: |
          cargo_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' crates/agent-bus-cli/Cargo.toml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$cargo_version" = "$tag_version" || {
            echo "Cargo version $cargo_version does not match tag $tag_version" >&2
            exit 1
          }

      - name: Release build
        timeout-minutes: 25
        run: cargo build --locked --release --target "$WINDOWS_TARGET" --workspace --bins

      - name: Verify embedded runtime revision under Wine
        shell: bash
        timeout-minutes: 5
        run: |
          python3 scripts/ci/wine_job.py versions \
            --binary "$CARGO_TARGET_DIR/$WINDOWS_TARGET/release/agent-bus.exe" \
            --binary "$CARGO_TARGET_DIR/$WINDOWS_TARGET/release/agent-bus-http.exe" \
            --wine-version-file "$RUNNER_TEMP/wine-version.txt"

      - name: Validate configured shipping GNU MCP executable
        timeout-minutes: 10
        shell: pwsh
        run: |
          $release = Join-Path $env:CARGO_TARGET_DIR "$env:WINDOWS_TARGET/release"
          ./scripts/test-agent-client-config-validator.ps1 -WineTestLauncher `
            -CliPath (Join-Path $release 'agent-bus.exe') `
            -McpBinaryPath (Join-Path $release 'agent-bus-mcp.exe')

      - name: Validate shipping CLI and HTTP against owned Wine fixtures
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/ci/isolated-services.py smoke --wine \
            --fixture-network runner-container \
            --network-container "$AGENT_BUS_CI_RUNNER_CONTAINER_ID" \
            --cli "$CARGO_TARGET_DIR/$WINDOWS_TARGET/release/agent-bus.exe" \
            --http "$CARGO_TARGET_DIR/$WINDOWS_TARGET/release/agent-bus-http.exe"

      - name: Stage artifacts and checksums
        shell: bash
        run: |
          release="$CARGO_TARGET_DIR/$WINDOWS_TARGET/release"
          mkdir -p dist
          for binary in agent-bus agent-bus-http agent-bus-mcp; do
            cp "$release/$binary.exe" "dist/$binary-windows-x64.exe"
          done
          {
            echo "commit=$GITHUB_SHA"
            echo "target=$WINDOWS_TARGET"
            echo "abi=gnu"
            echo "validation=wine"
            echo "native_windows_validated=false"
            echo "host_os=$RUNNER_OS"
            echo "host_arch=$RUNNER_ARCH"
            echo "runner_container_id=$AGENT_BUS_CI_RUNNER_CONTAINER_ID"
            echo "runner_image_id=$AGENT_HUB_WINDOWS_CROSS_IMAGE_ID"
            echo "runner_image_source_revision=$AGENT_HUB_WINDOWS_CROSS_IMAGE_SOURCE_REVISION"
            echo "runner_dockerfile_sha256=$AGENT_HUB_WINDOWS_CROSS_IMAGE_DOCKERFILE_SHA256"
            echo "configured_shipping_mcp_validation=wine-17-tools"
            echo "native_windows_dll_validation=not-tested"
            cat "$RUNNER_TEMP/wine-version.txt"
            rustc --version
            echo "cross_toolchain_and_cache_proof:"
            cat "$CARGO_TARGET_DIR/cross-toolchain-proof.json"
            echo "post_build_cache_stats:"
            "$RUSTC_WRAPPER" --show-stats --stats-format=json
            for binary in agent-bus agent-bus-http agent-bus-mcp; do
              echo "pe_imports_binary=$binary.exe"
              x86_64-w64-mingw32-objdump -p "$release/$binary.exe" | sed -n 's/^[[:space:]]*DLL Name: /dll=/p'
            done
          } > dist/BUILD-windows-x64.txt
          cd dist
          sha256sum ./*.exe > SHA256SUMS-windows-x64

      - uses: actions/upload-artifact@v7
        with:
          name: agent-bus-windows-x64
          path: dist/*

  linux:
    name: Linux release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: '["self-hosted","Linux","X64"]'
          - name: linux-arm64
            runner: '["self-hosted","Linux","ARM64","fleet-build"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/ci/setup-rust.sh

      - name: Verify Cargo version matches tag
        shell: bash
        run: |
          cargo_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' crates/agent-bus-cli/Cargo.toml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$cargo_version" = "$tag_version" || {
            echo "Cargo version $cargo_version does not match tag $tag_version" >&2
            exit 1
          }

      - run: cargo build --locked --release --workspace --bins

      - name: Verify embedded runtime revision
        shell: bash
        run: |
          expected_prefix="${AGENT_BUS_BUILD_REVISION:0:12}"
          cli_version="$("$CARGO_TARGET_DIR/release/agent-bus" --version)"
          grep -Fqi "$expected_prefix" <<<"$cli_version" || {
            echo "CLI build provenance mismatch: expected $expected_prefix, got $cli_version" >&2
            exit 1
          }
          http_version="$("$CARGO_TARGET_DIR/release/agent-bus-http" --version)"
          grep -Fqi "$expected_prefix" <<<"$http_version" || {
            echo "HTTP build provenance mismatch: expected $expected_prefix, got $http_version" >&2
            exit 1
          }

      - name: Stage artifacts and checksums
        shell: bash
        run: |
          mkdir -p dist
          for binary in agent-bus agent-bus-http agent-bus-mcp; do
            cp "$CARGO_TARGET_DIR/release/$binary" "dist/$binary-${{ matrix.name }}"
          done
          cd dist
          sha256sum ./* > "SHA256SUMS-${{ matrix.name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: agent-bus-${{ matrix.name }}
          path: dist/*

  publish:
    name: Publish GitHub release
    runs-on: [self-hosted, Linux, X64]
    needs: [windows-x64, linux]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: agent-bus-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Redis + PostgreSQL coordination bus for multi-agent AI systems.

            Artifacts are published for Windows x64, Linux x64, and Linux
            ARM64. Verify the matching `SHA256SUMS-*` file before installation.
